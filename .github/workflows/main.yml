name: "CI pipeline"

# Controls when the action will run.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  composer:
    name: "Composer config validation"
    runs-on: "ubuntu-latest"
    steps:
      - name: "GIT checkout"
        uses: "actions/checkout@v4"
      - name: "Validate composer.json"
        run: "make validate"
      - name: "Audit dependencies"
        run: "make audit"

  php:
    name: "PHP"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php_version: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: "GIT checkout"
        uses: "actions/checkout@v4"
      - name: "Install dependencies"
        run: "make install PHP_VERSION=${{ matrix.php_version }}"
      - name: "Lint PHP"
        run: "make lint PHP_VERSION=${{ matrix.php_version }}"
      - name: "PHP_CodeSniffer"
        run: "make sniff PHP_VERSION=${{ matrix.php_version }}"
      - name: "PHPStan Static Analysis"
        run: "make analyze PHP_VERSION=${{ matrix.php_version }}"
      - name: "PHPUnit tests"
        run: "make test PHP_VERSION=${{ matrix.php_version }}"

  php-lowest:
    name: "PHP 8.1 (lowest dependencies)"
    runs-on: ubuntu-latest
    steps:
      - name: "GIT checkout"
        uses: "actions/checkout@v4"
      - name: "Install lowest dependencies"
        run: "make install PHP_VERSION=8.1 DEPENDENCIES_LOWEST=1"
      - name: "Lint PHP"
        run: "make lint PHP_VERSION=8.1"
      - name: "PHP_CodeSniffer"
        run: "make sniff PHP_VERSION=8.1"
      - name: "PHPStan Static Analysis"
        run: "make analyze PHP_VERSION=8.1"
      - name: "PHPUnit tests"
        run: "make test PHP_VERSION=8.1"
